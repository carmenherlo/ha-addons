name: Space Race
version: "0.1.0"
slug: space_race
description: Juego de tablero en español para 1 a 6 jugadores, en el navegador.
url: https://github.com/carmenherlo/ha-addons/tree/main/space-race
arch:
  - amd64
init: false
startup: application
boot: auto

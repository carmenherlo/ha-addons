name: Missionboard
version: "0.3.0"
slug: missionboard
description: Tablero de misiones, rutinas y premios para niños, con voz en español.
url: https://github.com/carmenherlo/ha-addons/tree/main/missionboard
arch:
  - amd64
init: false
startup: application
boot: auto
# Opened from HA's sidebar (the app uses only relative URLs).
ingress: true
ingress_port: 8003
# Also on its own port, for the tablet's browser and non-admin users.
ports:
  8003/tcp: 8003
ports_description:
  8003/tcp: Missionboard directo, sin pasar por HA
panel_icon: mdi:star-circle
panel_title: Missionboard
# App data lives in the add-on's /data, so HA backups include it.

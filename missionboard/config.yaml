name: Missionboard
version: "0.1.0"
slug: missionboard
description: Tablero de misiones, rutinas y premios para niños, con voz en español.
url: https://github.com/carmenherlo/ha-addons/tree/main/missionboard
arch:
  - amd64
init: false
startup: application
boot: auto
# No Ingress: the app uses absolute URLs (/api, /static), which break under
# HA's ingress subpath. It is opened on its own port instead.
ports:
  8003/tcp: 8003
ports_description:
  8003/tcp: Missionboard en el navegador
webui: http://[HOST]:[PORT:8003]/
# App data lives in the add-on's /data, so HA backups include it.
